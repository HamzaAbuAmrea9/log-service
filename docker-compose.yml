services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c max_wal_size=1GB
        -c min_wal_size=256MB
        -c synchronous_commit=off
        -c full_page_writes=off
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c max_connections=50
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 2s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs?sslmode=disable
      PORT: "8080"
      RETENTION_DAYS: "30"
      AUTH_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      POOL_SIZE: "20"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
